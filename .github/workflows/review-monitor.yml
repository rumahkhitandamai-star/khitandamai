name: Monitor Google Reviews Real-time

on:
  schedule:
    # Berjalan otomatis setiap 5 menit untuk memantau ulasan Google Review baru
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check_reviews:
    name: Poll Google Reviews & Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll Google Reviews Directly & Notify
        run: |
          node scripts/poll-reviews-direct.js
