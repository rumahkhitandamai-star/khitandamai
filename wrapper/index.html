<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rumah Khitan Damai</title>

<link rel="icon" href="https://khitandamai.com/logoweb.jpg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    z-index:9999;
}

#loading img{
    width:120px;
    height:120px;
    border-radius:50%;
    animation:zoom 1.5s infinite alternate;
}

#loading p{
    margin-top:20px;
    font-size:18px;
    color:#1565c0;
    font-weight:bold;
}

@keyframes zoom{
    from{
        transform:scale(0.9);
    }
    to{
        transform:scale(1.05);
    }
}

iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>

</head>

<body>

<div id="loading">
    <img src="https://khitandamai.com/logoweb.jpg">
    <p>Memuat Aplikasi...</p>
</div>

<iframe
id="app"
src="https://script.google.com/macros/s/AKfycbwauluf8oZX58tJl14StNtwzknkB5jY8jI4Gofk_ssmhgXrBw7V-aNjYtYdPu-6yZs/exec"
allow="camera; microphone; geolocation"
loading="eager">
</iframe>

<script>

const iframe=document.getElementById("app");

iframe.onload=function(){
    document.getElementById("loading").style.display="none";
};

</script>

</body>
</html>
